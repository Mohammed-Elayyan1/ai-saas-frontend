<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصّة | الذكاء الاصطناعي للشركات — Platform | Enterprise AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-0: #07060f;
            --bg-1: #0c0a1a;
            --bg-2: #100d20;
            --glass: rgba(255, 255, 255, 0.045);
            --glass-strong: rgba(255, 255, 255, 0.075);
            --border: rgba(255, 255, 255, 0.09);
            --border-soft: rgba(255, 255, 255, 0.05);
            --violet: #8b6bff;
            --violet-2: #5b8dff;
            --gold: #f0b64c;
            --gold-2: #e69a2d;
            --text-0: #f4f2fb;
            --text-1: #b4aed0;
            --text-2: #7a749a;
            --success: #3ddc97;
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --shadow-glow: 0 0 0 1px var(--border), 0 20px 60px -20px rgba(80, 50, 255, 0.35);
            --font-ar: 'Tajawal', sans-serif;
            --font-en: 'Inter', sans-serif;
            --font-body: var(--font-ar);
        }

        :root:not([data-theme="light"]) {
            color-scheme: dark;
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme="light"]) {
                --bg-0: #0a0814;
                --bg-1: #0f0c1e;
            }
        }

        :root[data-theme="light"] {
            --bg-0: #f3f1fb;
            --bg-1: #ffffff;
            --bg-2: #ece9f9;
            --glass: rgba(20, 15, 50, 0.035);
            --glass-strong: rgba(20, 15, 50, 0.06);
            --border: rgba(20, 15, 50, 0.10);
            --border-soft: rgba(20, 15, 50, 0.06);
            --text-0: #181428;
            --text-1: #4c4770;
            --text-2: #847fa3;
            color-scheme: light;
        }

        html[lang="en"] {
            --font-body: var(--font-en);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background:
                radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139, 107, 255, 0.20), transparent 60%),
                radial-gradient(ellipse 900px 600px at 110% 10%, rgba(91, 141, 255, 0.16), transparent 55%),
                var(--bg-0);
            color: var(--text-0);
            line-height: 1.65;
            overflow-x: hidden;
            min-height: 100vh;
        }

        img,
        svg {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        input {
            font-family: inherit;
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 28px;
        }

        ::selection {
            background: rgba(139, 107, 255, 0.35);
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--violet-2);
            outline-offset: 3px;
            border-radius: 6px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        header.nav {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(16px) saturate(140%);
            background: color-mix(in srgb, var(--bg-0) 72%, transparent);
            border-bottom: 1px solid var(--border-soft);
        }

        .nav-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.15rem;
        }

        .brand .mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            box-shadow: 0 6px 18px -4px rgba(139, 107, 255, 0.6);
        }

        nav.links {
            display: flex;
            gap: 30px;
            font-size: 0.95rem;
            color: var(--text-1);
        }

        nav.links a {
            transition: color .2s;
        }

        nav.links a:hover {
            color: var(--text-0);
        }

        .nav-cta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--text-1);
        }

        .lang-btn {
            padding: 0 12px;
            width: auto;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.92rem;
            transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            color: #fff;
            box-shadow: 0 10px 30px -10px rgba(139, 107, 255, 0.7);
        }

        .btn-primary:hover {
            box-shadow: 0 14px 34px -8px rgba(139, 107, 255, 0.85);
        }

        .btn-ghost {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-0);
        }

        .btn-ghost:hover {
            background: var(--glass-strong);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
            color: #221604;
            box-shadow: 0 10px 26px -8px rgba(240, 182, 76, 0.55);
        }

        .btn-sm {
            padding: 9px 16px;
            font-size: 0.85rem;
        }

        .btn-block {
            width: 100%;
        }

        @media (max-width:860px) {
            nav.links {
                display: none;
            }
        }

        .hero {
            padding: 76px 0 40px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 56px;
            align-items: center;
        }

        @media (max-width:940px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 0.82rem;
            color: var(--text-1);
            margin-bottom: 22px;
        }

        .eyebrow .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        h1.hero-title {
            font-size: clamp(2.1rem, 4.6vw, 3.4rem);
            font-weight: 800;
            line-height: 1.28;
            letter-spacing: -0.5px;
            margin-bottom: 22px;
        }

        h1.hero-title .grad {
            background: linear-gradient(90deg, var(--violet) 10%, var(--violet-2) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p.hero-sub {
            font-size: 1.08rem;
            color: var(--text-1);
            max-width: 520px;
            margin-bottom: 32px;
        }

        .hero-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 36px;
        }

        .hero-trust {
            display: flex;
            gap: 26px;
            flex-wrap: wrap;
            color: var(--text-2);
            font-size: 0.85rem;
        }

        .hero-trust span {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .mock {
            position: relative;
            border-radius: var(--radius-lg);
            background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
            border: 1px solid var(--border);
            box-shadow: var(--shadow-glow);
            padding: 18px;
            overflow: hidden;
        }

        .mock::before {
            content: "";
            position: absolute;
            inset: -40% -40% auto auto;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(139, 107, 255, 0.28), transparent 70%);
            pointer-events: none;
        }

        .mock-topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .mock-topbar i {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border);
        }

        .mock-topbar .title {
            margin-inline-start: auto;
            font-size: 0.78rem;
            color: var(--text-2);
        }

        .mock-body {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        @media (max-width:520px) {
            .mock-body {
                grid-template-columns: 1fr;
            }

            .mock-side {
                display: none;
            }
        }

        .mock-side {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mock-side .item {
            font-size: 0.72rem;
            color: var(--text-2);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 8px;
        }

        .mock-side .item.active {
            background: var(--glass-strong);
            color: var(--text-0);
        }

        .mock-main {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 18px;
            min-height: 290px;
            display: flex;
            flex-direction: column;
        }

        .mock-msg {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.82rem;
            margin-bottom: 10px;
            animation: rise .5s ease both;
        }

        .mock-msg.user {
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            color: #fff;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        .mock-msg.ai {
            background: var(--glass-strong);
            border: 1px solid var(--border-soft);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            color: var(--text-1);
        }

        .mock-msg.ai .cursor {
            display: inline-block;
            width: 2px;
            height: 12px;
            background: var(--violet-2);
            margin-inline-start: 2px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .mock-input {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-0);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 0.78rem;
            color: var(--text-2);
        }

        .mock-input .send {
            margin-inline-start: auto;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .stat-badge {
            position: absolute;
            bottom: -18px;
            inset-inline-end: 24px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: 0 16px 34px -10px rgba(0, 0, 0, 0.55);
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-badge .num {
            font-weight: 800;
            font-size: 1.15rem;
        }

        .stat-badge .lbl {
            font-size: 0.72rem;
            color: var(--text-2);
        }

        @media (max-width:520px) {
            .stat-badge {
                display: none;
            }
        }

        section {
            padding: 88px 0;
        }

        .section-head {
            max-width: 640px;
            margin-bottom: 52px;
        }

        .section-head.center {
            margin-inline: auto;
            text-align: center;
        }

        .kicker {
            color: var(--violet-2);
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 10px;
            display: block;
        }

        h2.section-title {
            font-size: clamp(1.6rem, 3vw, 2.3rem);
            font-weight: 800;
            margin-bottom: 14px;
            letter-spacing: -0.4px;
        }

        p.section-sub {
            color: var(--text-1);
            font-size: 1.02rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        @media (max-width:900px) {
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:600px) {
            .features-grid {
                grid-template-columns: 1fr;
            }
        }

        .feature-card {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 26px;
            transition: border-color .2s, transform .2s;
        }

        .feature-card:hover {
            border-color: var(--border);
            transform: translateY(-3px);
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, rgba(139, 107, 255, 0.25), rgba(91, 141, 255, 0.18));
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .feature-card h3 {
            font-size: 1.05rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .feature-card p {
            color: var(--text-1);
            font-size: 0.92rem;
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        @media (max-width:900px) {
            .steps {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:520px) {
            .steps {
                grid-template-columns: 1fr;
            }
        }

        .step {
            position: relative;
            padding: 24px 20px 20px;
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
        }

        .step .step-num {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            margin-bottom: 14px;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            color: #fff;
            font-weight: 800;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step h4 {
            font-size: 0.98rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .step p {
            color: var(--text-1);
            font-size: 0.86rem;
        }

        .billing-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 44px;
        }

        .switch {
            width: 52px;
            height: 28px;
            border-radius: 999px;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            position: relative;
            flex-shrink: 0;
        }

        .switch .knob {
            position: absolute;
            top: 3px;
            inset-inline-end: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            transition: transform .25s ease;
        }

        html[dir="rtl"] .switch.on .knob {
            transform: translateX(-24px);
        }

        html[dir="ltr"] .switch.on .knob {
            transform: translateX(24px);
        }

        .save-chip {
            background: rgba(61, 220, 151, 0.12);
            color: var(--success);
            border: 1px solid rgba(61, 220, 151, 0.3);
            font-size: 0.74rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-items: stretch;
        }

        @media (max-width:900px) {
            .pricing-grid {
                grid-template-columns: 1fr;
                max-width: 420px;
                margin-inline: auto;
            }
        }

        .price-card {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-lg);
            padding: 30px 26px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .price-card.featured {
            background: linear-gradient(180deg, rgba(139, 107, 255, 0.12), var(--glass));
            border: 1px solid rgba(139, 107, 255, 0.45);
            box-shadow: 0 24px 60px -22px rgba(139, 107, 255, 0.5);
            transform: translateY(-8px);
        }

        @media (max-width:900px) {
            .price-card.featured {
                transform: none;
            }
        }

        .plan-badge {
            position: absolute;
            top: -14px;
            inset-inline-end: 26px;
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
            color: #221604;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 999px;
        }

        .plan-name {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .plan-desc {
            color: var(--text-2);
            font-size: 0.85rem;
            margin-bottom: 22px;
        }

        .plan-price {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 22px;
        }

        .plan-price .amount {
            font-size: 2.3rem;
            font-weight: 800;
        }

        .plan-price .period {
            color: var(--text-2);
            font-size: 0.88rem;
        }

        .plan-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
            margin-bottom: 26px;
            flex: 1;
        }

        .plan-list li {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: 0.88rem;
            color: var(--text-1);
        }

        .plan-list li .check {
            color: var(--success);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        @media (max-width:900px) {
            .trust-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:520px) {
            .trust-grid {
                grid-template-columns: 1fr;
            }
        }

        .trust-card {
            text-align: center;
            padding: 26px 16px;
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
        }

        .trust-card .ic {
            font-size: 1.6rem;
            margin-bottom: 12px;
        }

        .trust-card h4 {
            font-size: 0.92rem;
            margin-bottom: 6px;
        }

        .trust-card p {
            font-size: 0.8rem;
            color: var(--text-2);
        }

        .testi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        @media (max-width:900px) {
            .testi-grid {
                grid-template-columns: 1fr;
                max-width: 520px;
                margin-inline: auto;
            }
        }

        .testi-card {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 24px;
        }

        .stars {
            color: var(--gold);
            font-size: 0.9rem;
            margin-bottom: 14px;
            letter-spacing: 2px;
        }

        .testi-card p.quote {
            font-size: 0.92rem;
            color: var(--text-0);
            margin-bottom: 18px;
        }

        .testi-person {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
            color: #fff;
        }

        .testi-person .name {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .testi-person .role {
            font-size: 0.75rem;
            color: var(--text-2);
        }

        .auth-section {
            position: relative;
            border-radius: 28px;
            overflow: hidden;

        }

        .faq-list {

        }

        }

        .faq-a {

        .cta-final {

            font-weight: 800;
            margin-bottom: 16px;

        .cta-final p {

            margin-bottom: 30px;
            max-width: 520px;
            margin-inline: auto;
        }

        .cta-buttons {

            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        footer {

        .footer-grid {

            grid-template-columns: 1.4fr repeat(3, 1fr);
            gap: 32px;
            margin-bottom: 40px;
        }

        @media (max-width:800px) {
            .footer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:520px) {
            .footer-grid {
                grid-template-columns: 1fr;
            }
        }

        .footer-grid h5 {
            font-size: 0.85rem;
            margin-bottom: 16px;
            color: var(--text-1);
        }

        .footer-grid ul {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-grid a {
            font-size: 0.86rem;
            color: var(--text-2);
            transition: color .15s;
        }

        .footer-grid a:hover {
            color: var(--text-0);
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            color: var(--text-2);
            font-size: 0.8rem;
            padding-top: 24px;
            border-top: 1px solid var(--border-soft);
        }

        .socials {
            display: flex;
            gap: 10px;

        .socials a {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast {
            position: fixed;
            bottom: 26px;
            inset-inline-start: 50%;
            transform: translateX(-50%) translateY(120%);
            background: var(--bg-1);
            border: 1px solid var(--border);
            color: var(--text-0);
            padding: 13px 22px;
            border-radius: 12px;

            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90vw;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

      <div class="step">
        <div class="step-num">${i + 1}</div>
        <h4>${s.title}</h4>
        <p>${s.text}</p>
      </div>`).join('');

            // Pricing
            document.getElementById('pricingGrid').innerHTML = dict.pricing.plans.map(p => `
      <div class="price-card ${p.badge ? 'featured' : ''}">
        ${p.badge ? `<span class="plan-badge">${p.badge}</span>` : ''}
        <div class="plan-name">${p.name}</div>
        <div class="plan-desc">${p.desc}</div>
        <div class="plan-price"><span class="amount" data-monthly="${p.m}" data-yearly="${p.y}">$${p.m}</span><span class="period">${dict.pricing.perMonth}</span></div>
        <ul class="plan-list">${p.feats.map(f => `<li><span class="check">✔</span> ${f}</li>`).join('')}</ul>
        <a href="#auth" class="btn ${p.btnClass} btn-block">${p.cta}</a>
      </div>`).join('');

            // Trust
            document.getElementById('trustGrid').innerHTML = dict.trust.items.map(t => `
      <div class="trust-card"><div class="ic">${t.ic}</div><h4>${t.title}</h4><p>${t.text}</p></div>`).join('');

            // Testimonials
            document.getElementById('testiGrid').innerHTML = dict.testi.items.map(t => `
      <div class="testi-card">
        <div class="stars">★★★★★</div>
        <p class="quote">"${t.q}"</p>
        <div class="testi-person"><div class="avatar">${t.i}</div><div><div class="name">${t.n}</div><div class="role">${t.r}</div></div></div>
      </div>`).join('');

            // Auth list
            document.getElementById('authList').innerHTML = dict.auth.list.map(l => `<li>${l}</li>`).join('');

            // FAQ
            document.getElementById('faqList').innerHTML = dict.faq.items.map(f => `
      <div class="faq-item">
        <button class="faq-q">${f.q} <span class="chev">⌄</span></button>
        <div class="faq-a"><p>${f.a}</p></div>
      </div>`).join('');
            bindFaq();
            bindBillingAmounts(dict);
        }

        function bindFaq() {
            document.querySelectorAll('.faq-item').forEach(item => {
                const q = item.querySelector('.faq-q');
                const a = item.querySelector('.faq-a');
                q.addEventListener('click', () => {
                    const isOpen = item.classList.contains('open');
                    document.querySelectorAll('.faq-item.open').forEach(o => {
                        o.classList.remove('open');
                        o.querySelector('.faq-a').style.maxHeight = null;
                    });
                    if (!isOpen) {
                        item.classList.add('open');
                        a.style.maxHeight = a.scrollHeight + 'px';
                    }
                });
            });
        }

        let yearly = false;
        function bindBillingAmounts(dict) {
            document.querySelectorAll('.plan-price .amount').forEach(el => {
                const val = yearly ? el.dataset.yearly : el.dataset.monthly;
                el.textContent = '$' + val;
            });
            document.querySelectorAll('.plan-price .period').forEach(el => {
                el.textContent = yearly ? dict.pricing.perMonthYearly : dict.pricing.perMonth;
            });
        }

        function applyStatic(dict) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const val = get(dict, key);
                if (val !== undefined) el.textContent = val;
            });
            document.querySelectorAll('[data-i18n-html]').forEach(el => {
                const key = el.getAttribute('data-i18n-html');
                const val = get(dict, key);
                if (val !== undefined) el.innerHTML = val;
            });
        }

        function setAuthMode(mode, dict) {
            const isSignup = mode === 'signup';
            document.getElementById('tabLogin').classList.toggle('active', !isSignup);
            document.getElementById('tabSignup').classList.toggle('active', isSignup);
            document.getElementById('nameField').style.display = isSignup ? 'block' : 'none';
            document.getElementById('authSubmit').textContent = isSignup ? dict.auth.submitSignup : dict.auth.submitLogin;
            const switchText = isSignup
                ? `${dict.auth.noAccount} <a href="#" id="modeLink">${dict.auth.loginLink}</a>`
                : `${dict.auth.haveAccount} <a href="#" id="modeLink">${dict.auth.signupLink}</a>`;
            document.getElementById('switchModeText').innerHTML = switchText;
            document.getElementById('modeLink').addEventListener('click', (e) => {
                e.preventDefault();
                setAuthMode(isSignup ? 'login' : 'signup', currentDict());
            });
        }

        let authMode = 'login';

        function currentDict() { return T[lang]; }

        function setLanguage(l) {
            lang = l;
            const dict = T[lang];
            const html = document.documentElement;
            html.lang = lang;
            html.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.title = lang === 'ar' ? 'منصّة | الذكاء الاصطناعي للشركات' : 'Platform | Enterprise AI';
            document.getElementById('langToggle').textContent = lang === 'ar' ? 'EN' : 'AR';
            applyStatic(dict);
            renderDynamic(dict);
            setAuthMode(authMode, dict);
            resetTyping(dict);
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            setLanguage(lang === 'ar' ? 'en' : 'ar');
        });

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            const root = document.documentElement;
            const isLight = root.getAttribute('data-theme') === 'light';
            root.setAttribute('data-theme', isLight ? 'dark' : 'light');
            themeToggle.textContent = isLight ? '🌙' : '☀️';
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // Hero typing animation
        let typingTimer = null;
        let typingToken = 0;
        function resetTyping(dict) {
            typingToken++;
            const myToken = typingToken;
            const el = document.getElementById('typingMsg');
            const text = dict.hero.typing;
            let ci = 0;
            clearTimeout(typingTimer);
            function loop() {
                if (myToken !== typingToken) return;
                if (ci <= text.length) {
                    el.innerHTML = text.slice(0, ci) + '<span class="cursor"></span>';
                    ci++;
                    typingTimer = setTimeout(loop, 26);
                } else {
                    typingTimer = setTimeout(() => { ci = 0; loop(); }, 3500);
                }
            }
            loop();
        }

        // Billing switch
        document.getElementById('billingSwitch').addEventListener('click', () => {
            yearly = !yearly;
            document.getElementById('billingSwitch').classList.toggle('on', yearly);
            bindBillingAmounts(currentDict());
        });

        // Auth tabs
        document.getElementById('tabLogin').addEventListener('click', () => { authMode = 'login'; setAuthMode('login', currentDict()); });
        document.getElementById('tabSignup').addEventListener('click', () => { authMode = 'signup'; setAuthMode('signup', currentDict()); });
        document.getElementById('authForm').addEventListener('submit', async () => {
            const dict = currentDict();

            if (authMode === 'login') {
                // No real account/password system exists yet — say so honestly instead of pretending to log in.
                showToast(dict.auth.loginNotAvailable);
                return;
            }

            // Signup: this actually saves the company + email to the backend and issues
            // a real free-trial API key immediately (no payment involved, so instant issuance is fine).
            const name = document.getElementById('companyName').value.trim();
            const email = document.getElementById('email').value.trim();
            if (!name || !email) {
                showToast(lang === 'ar' ? 'يرجى تعبئة اسم الشركة والبريد الإلكتروني' : 'Please fill in company name and email');
                return;
            }

            const btn = document.getElementById('authSubmit');
            const originalText = btn.textContent;
            btn.textContent = '...'; btn.disabled = true;
            try {
                const body = new URLSearchParams({ name, email });
                const res = await fetch(`${API_BASE_URL}/enterprise/register-trial`, { method: 'POST', body });
                let data = null;
                try { data = await res.json(); } catch (parseErr) { data = null; }

                if (!res.ok) {
                    showToast(data && data.detail ? data.detail : dict.auth.signupNetworkError);
                    return;
                }

                if (data && data.api_key) {
                    showApiKey(data.api_key);
                }
                document.getElementById('authForm').reset();
            } catch (err) {
                showToast(dict.auth.signupNetworkError);
            } finally {
                btn.textContent = originalText; btn.disabled = false;
            }
        });

        document.getElementById('googleBtn').addEventListener('click', () => {
            showToast(currentDict().auth.googleComingSoon);
        });

        // Payment
        // --- Wire the PayPal per-plan buttons to the real payment links ---
        document.querySelectorAll('#paypalLinkRow .amount-chip').forEach(a => {
            a.href = PAYPAL_LINKS[a.dataset.plan];
            a.addEventListener('click', () => {
                document.querySelectorAll('#paypalLinkRow .amount-chip').forEach(c => c.classList.remove('active'));
                a.classList.add('active');
                selectedPaypalPlan = a.dataset.plan;
            });
        });
        let selectedPaypalPlan = 'basic';

        function showApiKey(key) {
            document.getElementById('apiKeyValue').textContent = key;
            document.getElementById('apiKeyResult').style.display = 'block';
            document.getElementById('apiKeyResult').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        document.getElementById('copyKeyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(document.getElementById('apiKeyValue').textContent);
            showToast(lang === 'ar' ? 'تم النسخ' : 'Copied');
        });

        // --- Real PayPal claim: sends the request to your backend for manual review.
        //     No API key is issued instantly — the backend returns {status:"pending", message}.
        document.getElementById('paypalClaimForm').addEventListener('submit', async () => {
            const name = document.getElementById('ppName').value.trim();
            const email = document.getElementById('ppEmail').value.trim();
            const paypal_reference = document.getElementById('ppRef').value.trim();
            if (!name || !email) {
                showToast(lang === 'ar' ? 'يرجى تعبئة اسم الشركة والبريد الإلكتروني' : 'Please fill in company name and email');
                return;
            }

            const btn = document.getElementById('paypalClaimBtn');
            const originalText = btn.textContent;
            btn.textContent = '...'; btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE_URL}/enterprise/paypal/claim`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, plan: selectedPaypalPlan, paypal_reference })
                });
                let data = null;
                try { data = await res.json(); } catch (parseErr) { data = null; }

                if (!res.ok) {
                    const detail = data && data.detail ? data.detail : currentDict().pay.paypalClaimError;
                    showToast(detail);
                    return;
                }

                // Backend intentionally does NOT return an api_key here (pending-approval flow).
                // Show its confirmation message instead of trying to display a key.
                showToast(data && data.message ? data.message : currentDict().pay.paypalClaimError);
                document.getElementById('paypalClaimForm').reset();
            } catch (err) {
                // Network error (backend unreachable, CORS, wrong API_BASE_URL, etc.)
                showToast(lang === 'ar'
                    ? 'تعذّر الاتصال بالخادم. تحقق من اتصالك بالإنترنت وحاول مجددًا.'
                    : 'Could not reach the server. Check your connection and try again.');
            } finally {
                btn.textContent = originalText; btn.disabled = false;
            }
        });
        // === نظام التجربة المجانية، الـ PayPal، وتصحيح شكل صندوق تسجيل الدخول ليكون مربعاً أنيقاً ===
        (function () {
            const TRIAL_DAYS = 7; // مدة التجربة المجانية

            // روابط باي بال المعتمدة للباقات
            const PAYPAL_LINKS = {
                starter: 'https://www.paypal.com/ncp/payment/23V3WQK4NVTG4',     // باقة Starter (29$)
                pro: 'https://www.paypal.com/ncp/payment/Z59KCWS6MZAC6',         // باقة Pro (79$)
                enterprise: 'https://www.paypal.com/ncp/payment/CS59KMKAETBFC'  // باقة Enterprise (199$)
            };

            function updateUIState() {
                const isLoggedIn = localStorage.getItem('is_logged_in') === 'true';
                const userEmail = localStorage.getItem('user_email') || 'حسابي';
                const companyName = localStorage.getItem('company_name') || '';

                // إدارة أيام التجربة المجانية (تناقص بمرور الوقت ولا تعود للبداية)
                let trialStart = localStorage.getItem('trial_start_date');
                if (!trialStart && isLoggedIn) {
                    trialStart = new Date().toISOString();
                    localStorage.setItem('trial_start_date', trialStart);
                }

                let remainingDays = TRIAL_DAYS;
                if (trialStart) {
                    const startDate = new Date(trialStart);
                    const now = new Date();
                    const diffTime = now - startDate;
                    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    remainingDays = Math.max(0, TRIAL_DAYS - diffDays);
                }

                // توليد مفتاح API فريد للمستخدم
                let userApiKey = localStorage.getItem('user_api_key');
                if (!userApiKey && isLoggedIn) {
                    userApiKey = 'ai_saas_' + Math.random().toString(36).substring(2, 10) + '_' + Math.random().toString(36).substring(2, 10);
                    localStorage.setItem('user_api_key', userApiKey);
                }

                // 1. تحديث زر تسجيل الدخول في القائمة العلوية
                document.querySelectorAll('a, button').forEach(el => {
                    const text = el.textContent.trim();
                    if (text === 'تسجيل الدخول' || text === 'تسجيل دخول') {
                        if (!el.closest('.user-profile-box')) {
                            if (isLoggedIn) {
                                el.textContent = `👤 ${companyName ? companyName : userEmail}`;
                                el.style.display = '';
                            } else {
                                el.textContent = 'تسجيل الدخول';
                                el.style.display = '';
                            }
                        }
                    }
                });

                // 2. إخفاء أزرار الـ CTA الكبيرة عند تسجيل الدخول
                document.querySelectorAll('a, button').forEach(el => {
                    const text = el.textContent.trim();
                    const isCta = text.includes('ابدأ تجربتك المجانية') || text.includes('ابداً تجربتك المجانية') || text.includes('ابدأ رحلتك الآن') || text.includes('ابداً رحلتك الآن') || text.includes('إنشاء حساب');
                    if (isCta && !el.closest('.user-profile-box') && !el.closest('form')) {
                        el.style.display = isLoggedIn ? 'none' : '';
                    }
                });

                // 3. إنشاء أو العثور على الحاوية الخاصة بتسجيل الدخول وجعلها بشكل "مربع / بطاقة" أنيقة ومقيدة العرض
                let portalContainer = document.getElementById('custom-user-portal-container');
                if (!portalContainer) {
                    portalContainer = document.createElement('div');
                    portalContainer.id = 'custom-user-portal-container';
                    // تعديل المقاسات لتصبح مربعة الشكل بمنتصف الصفحة وبدون تمدد عرضي مزعج
                    portalContainer.style.cssText = 'width: 100%; max-width: 420px; margin: 40px auto; padding: 30px; background: rgba(15, 23, 42, 0.95); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; position: relative; z-index: 99; box-sizing: border-box;';

                    // البحث عن قسم البطاقات لوضعه تحته تماماً
                    let targetAnchor = null;
                    document.querySelectorAll('div, section').forEach(el => {
                        if (el.textContent.includes('فهم بيانات شركتك') && el.textContent.includes('مفتاح API خاص بك')) {
                            targetAnchor = el;
                        }
                    });

                    if (targetAnchor && targetAnchor.parentNode) {
                        targetAnchor.parentNode.insertBefore(portalContainer, targetAnchor.nextSibling);
                    } else {
                        document.body.appendChild(portalContainer);
                    }
                }

                // 4. عرض محتوى بطاقة الملف الشخصي أو نموذج تسجيل الدخول بشكله المربع والمرتب
                if (isLoggedIn) {
                    portalContainer.innerHTML = `
                <div style="font-size: 50px; margin-bottom: 10px;">👤</div>
                <h3 style="margin: 0 0 5px 0; font-size: 22px; color: #fff;">أهلاً بك مجدداً</h3>
                ${companyName ? `<p style="color: #fff; font-size: 15px; margin-bottom: 3px; font-weight: bold;">🏢 ${companyName}</p>` : ''}
                <p style="color: #4da6ff; font-size: 14px; margin-bottom: 15px; direction: ltr;">${userEmail}</p>
                
                <!-- عداد الأيام المتبقية -->
                <div style="background: rgba(241, 196, 15, 0.15); border: 1px solid rgba(241, 196, 15, 0.3); padding: 8px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; color: #f1c40f;">
                    ⏳ التجربة المجانية نشطة: متبقي <b>${remainingDays}</b> أيام من أصل ${TRIAL_DAYS} أيام.
                </div>

                <!-- صندوق عرض مفتاح API مع زر النسخ -->
                <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: right; border: 1px solid rgba(255,255,255,0.1);">
                    <p style="color: #aaa; font-size: 12px; margin: 0 0 6px 0;">🔑 مفتاح الوصول (API Key):</p>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="text" readonly value="${userApiKey}" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 10px; border-radius: 6px; width: 100%; font-family: monospace; font-size: 11px; direction: ltr;" id="userApiKeyField">
                        <button type="button" id="copyApiKeyBtn" style="background: #3498db; color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; font-weight: bold;">نسخ</button>
                    </div>
                </div>

                <button type="button" class="globalLogoutBtn" style="background: #e74c3c; color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; transition: 0.3s; box-shadow: 0 4px 12px rgba(231,76,60,0.4);">تسجيل الخروج</button>
            `;

                    setTimeout(() => {
                        const copyBtn = document.getElementById('copyApiKeyBtn');
                        if (copyBtn) {
                            copyBtn.onclick = function () {
                                const field = document.getElementById('userApiKeyField');
                                navigator.clipboard.writeText(field.value);
                                copyBtn.textContent = 'تم النسخ! ✓';
                                copyBtn.style.background = '#2ecc71';
                                setTimeout(() => {
                                    copyBtn.textContent = 'نسخ';
                                    copyBtn.style.background = '#3498db';
                                }, 2000);
                            };
                        }
                    }, 50);

                } else {
                    portalContainer.innerHTML = `
                <h3 style="color: #fff; margin-bottom: 15px; font-size: 20px;">تسجيل الدخول / بدء التجربة</h3>
                <form id="customLoginForm" style="display: flex; flex-direction: column; gap: 12px;">
                    <input type="email" placeholder="البريد الإلكتروني" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box;">
                    <input type="text" placeholder="اسم الشركة (اختياري)" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box;">
                    <button type="submit" style="background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%;">دخول / تفعيل التجربة</button>
                </form>
            `;
                }
            }

            setInterval(updateUIState, 300);

            // 5. توجيه أزرار الباقات لروابط الدفع في PayPal مباشرة عند الضغط عليها
            document.addEventListener('click', function (e) {
                const target = e.target.closest('a, button');
                if (!target) return;

                const text = target.textContent.trim();

                const isStarterBtn = text.includes('الأساسية') || text.includes('Starter') || text.includes('29');
                const isProBtn = text.includes('احترافية') || text.includes('Pro') || text.includes('79');
                const isEnterpriseBtn = text.includes('Enterprise') || text.includes('الشركات') || text.includes('199') || text.includes('مبيعات') || text.includes('تواصل');

                if (isStarterBtn) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.location.href = PAYPAL_LINKS.starter;
                } else if (isProBtn) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.location.href = PAYPAL_LINKS.pro;
                } else if (isEnterpriseBtn) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.location.href = PAYPAL_LINKS.enterprise;
                }
            }, true);

            // 6. تفعيل زر تسجيل الخروج
            document.addEventListener('click', function (e) {
                if (e.target && e.target.classList.contains('globalLogoutBtn')) {
                    e.preventDefault();
                    e.stopPropagation();
                    localStorage.removeItem('is_logged_in');
                    localStorage.removeItem('user_email');
                    localStorage.removeItem('company_name');
                    localStorage.removeItem('trial_start_date');
                    localStorage.removeItem('user_api_key');
                    window.location.reload();
                }
            });

            // 7. معالجة إرسال نموذج تسجيل الدخول
            window.addEventListener('submit', function (e) {
                const form = e.target;
                if (form.id === 'paypalClaimForm') return;

                if (form.id === 'customLoginForm' || form.querySelector('input[type="email"]')) {
                    e.preventDefault();
                    const emailInput = form.querySelector('input[type="email"]');
                    const companyInput = form.querySelector('input[placeholder*="الشركة"]');

                    if (emailInput) {
                        const email = emailInput.value.trim();
                        const company = companyInput ? companyInput.value.trim() : '';

                        if (email) {
                            localStorage.setItem('is_logged_in', 'true');
                            localStorage.setItem('user_email', email);
                            if (!localStorage.getItem('trial_start_date')) {
                                localStorage.setItem('trial_start_date', new Date().toISOString());
                            }
                            if (company) {
                                localStorage.setItem('company_name', company);
                            }
                            updateUIState();
                        } else {
                            alert('يرجى إدخال البريد الإلكتروني للمتابعة.');
                        }
                    }
                }
            }, true);
        })();
        // Init
        setLanguage('ar');
    </script>

</body>
