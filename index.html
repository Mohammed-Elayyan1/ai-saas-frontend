<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI | منصة الذكاء الاصطناعي للشركات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-0: #07060f;
            --bg-1: #0c0a1a;
            --bg-2: #100d20;
            --glass: rgba(255, 255, 255, 0.045);
            --glass-strong: rgba(255, 255, 255, 0.075);
            --border: rgba(255, 255, 255, 0.09);
            --border-soft: rgba(255, 255, 255, 0.05);
            --violet: #8b6bff;
            --violet-2: #5b8dff;
            --gold: #f0b64c;
            --gold-2: #e69a2d;
            --text-0: #f4f2fb;
            --text-1: #b4aed0;
            --text-2: #7a749a;
            --success: #3ddc97;
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --shadow-glow: 0 0 0 1px var(--border), 0 20px 60px -20px rgba(80, 50, 255, 0.35);
            --font-ar: 'Tajawal', sans-serif;
            --font-en: 'Inter', sans-serif;
            --font-body: var(--font-ar);
        }

        :root:not([data-theme="light"]) {
            color-scheme: dark;
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme="light"]) {
                --bg-0: #0a0814;
                --bg-1: #0f0c1e;
            }
        }

        :root[data-theme="light"] {
            --bg-0: #f3f1fb;
            --bg-1: #ffffff;
            --bg-2: #ece9f9;
            --glass: rgba(20, 15, 50, 0.035);
            --glass-strong: rgba(20, 15, 50, 0.06);
            --border: rgba(20, 15, 50, 0.10);
            --border-soft: rgba(20, 15, 50, 0.06);
            --text-0: #181428;
            --text-1: #4c4770;
            --text-2: #847fa3;
            color-scheme: light;
        }

        html[lang="en"] {
            --font-body: var(--font-en);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background:
                radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139, 107, 255, 0.20), transparent 60%),
                radial-gradient(ellipse 900px 600px at 110% 10%, rgba(91, 141, 255, 0.16), transparent 55%),
                var(--bg-0);
            color: var(--text-0);
            line-height: 1.65;
            overflow-x: hidden;
            min-height: 100vh;
        }

        img,
        svg {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        input {
            font-family: inherit;
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 28px;
        }

        ::selection {
            background: rgba(139, 107, 255, 0.35);
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--violet-2);
            outline-offset: 3px;
            border-radius: 6px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        header.nav {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(16px) saturate(140%);
            background: color-mix(in srgb, var(--bg-0) 72%, transparent);
            border-bottom: 1px solid var(--border-soft);
        }

        .nav-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.15rem;
        }

        .brand .mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            box-shadow: 0 6px 18px -4px rgba(139, 107, 255, 0.6);
        }

        nav.links {
            display: flex;
            gap: 30px;
            font-size: 0.95rem;
            color: var(--text-1);
        }

        nav.links a {
            transition: color .2s;
        }

        nav.links a:hover {
            color: var(--text-0);
        }

        .nav-cta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--text-1);
        }

        .lang-btn {
            padding: 0 12px;
            width: auto;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 22px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.92rem;
            transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            color: #fff;
            box-shadow: 0 10px 30px -10px rgba(139, 107, 255, 0.7);
        }

        .btn-primary:hover {
            box-shadow: 0 14px 34px -8px rgba(139, 107, 255, 0.85);
        }

        .btn-ghost {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-0);
        }

        .btn-ghost:hover {
            background: var(--glass-strong);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
            color: #221604;
            box-shadow: 0 10px 26px -8px rgba(240, 182, 76, 0.55);
        }

        .btn-sm {
            padding: 9px 16px;
            font-size: 0.85rem;
        }

        .btn-block {
            width: 100%;
        }

        @media (max-width:860px) {
            nav.links {
                display: none;
            }
        }

        .hero {
            padding: 76px 0 40px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 56px;
            align-items: center;
        }

        @media (max-width:940px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 7px 16px;
            border-radius: 999px;
            font-size: 0.82rem;
            color: var(--text-1);
            margin-bottom: 22px;
        }

        .eyebrow .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        h1.hero-title {
            font-size: clamp(2.1rem, 4.6vw, 3.4rem);
            font-weight: 800;
            line-height: 1.28;
            letter-spacing: -0.5px;
            margin-bottom: 22px;
        }

        h1.hero-title .grad {
            background: linear-gradient(90deg, var(--violet) 10%, var(--violet-2) 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        p.hero-sub {
            font-size: 1.08rem;
            color: var(--text-1);
            max-width: 520px;
            margin-bottom: 32px;
        }

        .hero-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 36px;
        }

        .hero-trust {
            display: flex;
            gap: 26px;
            flex-wrap: wrap;
            color: var(--text-2);
            font-size: 0.85rem;
        }

        .hero-trust span {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .mock {
            position: relative;
            border-radius: var(--radius-lg);
            background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
            border: 1px solid var(--border);
            box-shadow: var(--shadow-glow);
            padding: 18px;
            overflow: hidden;
        }

        .mock::before {
            content: "";
            position: absolute;
            inset: -40% -40% auto auto;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(139, 107, 255, 0.28), transparent 70%);
            pointer-events: none;
        }

        .mock-topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .mock-topbar i {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border);
        }

        .mock-topbar .title {
            margin-inline-start: auto;
            font-size: 0.78rem;
            color: var(--text-2);
        }

        .mock-body {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 14px;
            position: relative;
            z-index: 1;
        }

        @media (max-width:520px) {
            .mock-body {
                grid-template-columns: 1fr;
            }

            .mock-side {
                display: none;
            }
        }

        .mock-side {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mock-side .item {
            font-size: 0.72rem;
            color: var(--text-2);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 8px;
        }

        .mock-side .item.active {
            background: var(--glass-strong);
            color: var(--text-0);
        }

        .mock-main {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 18px;
            min-height: 290px;
            display: flex;
            flex-direction: column;
        }

        .mock-msg {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.82rem;
            margin-bottom: 10px;
            animation: rise .5s ease both;
        }

        .mock-msg.user {
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            color: #fff;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        .mock-msg.ai {
            background: var(--glass-strong);
            border: 1px solid var(--border-soft);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            color: var(--text-1);
        }

        .mock-msg.ai .cursor {
            display: inline-block;
            width: 2px;
            height: 12px;
            background: var(--violet-2);
            margin-inline-start: 2px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .mock-input {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-0);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 0.78rem;
            color: var(--text-2);
        }

        .mock-input .send {
            margin-inline-start: auto;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.7rem;
            flex-shrink: 0;
        }

        .stat-badge {
            position: absolute;
            bottom: -18px;
            inset-inline-end: 24px;
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            box-shadow: 0 16px 34px -10px rgba(0, 0, 0, 0.55);
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-badge .num {
            font-weight: 800;
            font-size: 1.15rem;
        }

        .stat-badge .lbl {
            font-size: 0.72rem;
            color: var(--text-2);
        }

        @media (max-width:520px) {
            .stat-badge {
                display: none;
            }
        }

        section {
            padding: 88px 0;
        }

        .section-head {
            max-width: 640px;
            margin-bottom: 52px;
        }

        .section-head.center {
            margin-inline: auto;
            text-align: center;
        }

        .kicker {
            color: var(--violet-2);
            font-weight: 700;
            font-size: 0.88rem;
            margin-bottom: 10px;
            display: block;
        }

        h2.section-title {
            font-size: clamp(1.6rem, 3vw, 2.3rem);
            font-weight: 800;
            margin-bottom: 14px;
            letter-spacing: -0.4px;
        }

        p.section-sub {
            color: var(--text-1);
            font-size: 1.02rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        @media (max-width:900px) {
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:600px) {
            .features-grid {
                grid-template-columns: 1fr;
            }
        }

        .feature-card {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 26px;
            transition: border-color .2s, transform .2s;
        }

        .feature-card:hover {
            border-color: var(--border);
            transform: translateY(-3px);
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, rgba(139, 107, 255, 0.25), rgba(91, 141, 255, 0.18));
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .feature-card h3 {
            font-size: 1.05rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .feature-card p {
            color: var(--text-1);
            font-size: 0.92rem;
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        @media (max-width:900px) {
            .steps {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:520px) {
            .steps {
                grid-template-columns: 1fr;
            }
        }

        .step {
            position: relative;
            padding: 24px 20px 20px;
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
        }

        .step .step-num {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            margin-bottom: 14px;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            color: #fff;
            font-weight: 800;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .step h4 {
            font-size: 0.98rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .step p {
            color: var(--text-1);
            font-size: 0.86rem;
        }

        .billing-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 44px;
        }

        .switch {
            width: 52px;
            height: 28px;
            border-radius: 999px;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            position: relative;
            flex-shrink: 0;
        }

        .switch .knob {
            position: absolute;
            top: 3px;
            inset-inline-end: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            transition: transform .25s ease;
        }

        html[dir="rtl"] .switch.on .knob {
            transform: translateX(-24px);
        }

        html[dir="ltr"] .switch.on .knob {
            transform: translateX(24px);
        }

        .save-chip {
            background: rgba(61, 220, 151, 0.12);
            color: var(--success);
            border: 1px solid rgba(61, 220, 151, 0.3);
            font-size: 0.74rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            align-items: stretch;
        }

        @media (max-width:900px) {
            .pricing-grid {
                grid-template-columns: 1fr;
                max-width: 420px;
                margin-inline: auto;
            }
        }

        .price-card {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-lg);
            padding: 30px 26px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .price-card.featured {
            background: linear-gradient(180deg, rgba(139, 107, 255, 0.12), var(--glass));
            border: 1px solid rgba(139, 107, 255, 0.45);
            box-shadow: 0 24px 60px -22px rgba(139, 107, 255, 0.5);
            transform: translateY(-8px);
        }

        @media (max-width:900px) {
            .price-card.featured {
                transform: none;
            }
        }

        .plan-badge {
            position: absolute;
            top: -14px;
            inset-inline-end: 26px;
            background: linear-gradient(135deg, var(--gold), var(--gold-2));
            color: #221604;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 999px;
        }

        .plan-name {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .plan-desc {
            color: var(--text-2);
            font-size: 0.85rem;
            margin-bottom: 22px;
        }

        .plan-price {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 22px;
        }

        .plan-price .amount {
            font-size: 2.3rem;
            font-weight: 800;
        }

        .plan-price .period {
            color: var(--text-2);
            font-size: 0.88rem;
        }

        .plan-list {
            display: flex;
            flex-direction: column;
            gap: 11px;
            margin-bottom: 26px;
            flex: 1;
        }

        .plan-list li {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: 0.88rem;
            color: var(--text-1);
        }

        .plan-list li .check {
            color: var(--success);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        @media (max-width:900px) {
            .trust-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width:520px) {
            .trust-grid {
                grid-template-columns: 1fr;
            }
        }

        .trust-card {
            text-align: center;
            padding: 26px 16px;
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
        }

        .trust-card .ic {
            font-size: 1.6rem;
            margin-bottom: 12px;
        }

        .trust-card h4 {
            font-size: 0.92rem;
            margin-bottom: 6px;
        }

        .trust-card p {
            font-size: 0.8rem;
            color: var(--text-2);
        }

        .testi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        @media (max-width:900px) {
            .testi-grid {
                grid-template-columns: 1fr;
                max-width: 520px;
                margin-inline: auto;
            }
        }

        .testi-card {
            background: var(--glass);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-md);
            padding: 24px;
        }

        .stars {
            color: var(--gold);
            font-size: 0.9rem;
            margin-bottom: 14px;
            letter-spacing: 2px;
        }

        .testi-card p.quote {
            font-size: 0.92rem;
            color: var(--text-0);
            margin-bottom: 18px;
        }

        .testi-person {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--violet), var(--violet-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
            color: #fff;
        }

        .testi-person .name {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .testi-person .role {
            font-size: 0.75rem;
            color: var(--text-2);
        }

        .auth-section {
            position: relative;
            border-radius: 28px;
            overflow: hidden;

</head>

                faq: {
                    kicker: "FAQ", title: "Everything you need to know before you start",
                    items: [
                        { q: "Do I need technical experience to get started?", a: "No. You can sign up and get your API key in minutes, then integrate it by following our simple docs." },
                        { q: "Can I change my plan later?", a: "Yes, you can upgrade or downgrade anytime from your dashboard without losing your data." },
                        { q: "What payment methods are available?", a: "We currently support PayPal. Pay for your plan and get your API key instantly to start using the platform." },
                        { q: "Is my data secure?", a: "All data is encrypted in transit and at rest, and is never shared with third parties." },
                        { q: "Is there a money-back guarantee?", a: "Yes, we offer a full refund within the first 14 days of any plan." }
                    ]
                },
                ctaFinal: {
                    title: "Ready to automate your company with AI?", sub: "Join today and get 14 days free to try every feature of the platform, no commitment.",
                    primary: "Start your free trial", secondary: "Log in"
                },
                footer: {
                    desc: "An enterprise AI platform that helps you automate replies and customer support, securely and fast.",
                    product: "Product", company: "Company", about: "About", contact: "Contact", careers: "Careers",
                    legal: "Legal", privacy: "Privacy Policy", terms: "Terms of Service",
                    copyright: "© 2026 Platform. All rights reserved.", tagline: "Built with care for businesses everywhere"
                }
            }
        };

        let lang = 'ar';

        function get(obj, path) { return path.split('.').reduce((o, k) => (o || {})[k], obj); }

        function renderDynamic(dict) {
            // Features
            document.getElementById('featuresGrid').innerHTML = dict.features.items.map(f => `
      <div class="feature-card">
        <div class="feature-icon">${f.icon}</div>
        <h3>${f.title}</h3>
        <p>${f.text}</p>
      </div>`).join('');

            // Steps
            document.getElementById('stepsGrid').innerHTML = dict.how.steps.map((s, i) => `
      <div class="step">
        <div class="step-num">${i + 1}</div>
        <h4>${s.title}</h4>
        <p>${s.text}</p>
      </div>`).join('');

            // Pricing
            document.getElementById('pricingGrid').innerHTML = dict.pricing.plans.map(p => `
      <div class="price-card ${p.badge ? 'featured' : ''}">
        ${p.badge ? `<span class="plan-badge">${p.badge}</span>` : ''}
        <div class="plan-name">${p.name}</div>
        <div class="plan-desc">${p.desc}</div>
        <div class="plan-price"><span class="amount" data-monthly="${p.m}" data-yearly="${p.y}">$${p.m}</span><span class="period">${dict.pricing.perMonth}</span></div>
        <ul class="plan-list">${p.feats.map(f => `<li><span class="check">✔</span> ${f}</li>`).join('')}</ul>
        <button type="button" class="btn ${p.btnClass} btn-block plan-cta" data-plan="${p.key}">${p.cta}</button>
      </div>`).join('');
            bindPricingButtons();

            // Trust
            document.getElementById('trustGrid').innerHTML = dict.trust.items.map(t => `
      <div class="trust-card"><div class="ic">${t.ic}</div><h4>${t.title}</h4><p>${t.text}</p></div>`).join('');

            // Testimonials
            document.getElementById('testiGrid').innerHTML = dict.testi.items.map(t => `
      <div class="testi-card">
        <div class="stars">★★★★★</div>
        <p class="quote">"${t.q}"</p>
        <div class="testi-person"><div class="avatar">${t.i}</div><div><div class="name">${t.n}</div><div class="role">${t.r}</div></div></div>
      </div>`).join('');

            // Auth list
            document.getElementById('authList').innerHTML = dict.auth.list.map(l => `<li>${l}</li>`).join('');

            // FAQ
            document.getElementById('faqList').innerHTML = dict.faq.items.map(f => `
      <div class="faq-item">
        <button class="faq-q">${f.q} <span class="chev">⌄</span></button>
        <div class="faq-a"><p>${f.a}</p></div>
      </div>`).join('');
            bindFaq();
            bindBillingAmounts(dict);
        }

        function bindFaq() {
            document.querySelectorAll('.faq-item').forEach(item => {
                const q = item.querySelector('.faq-q');
                const a = item.querySelector('.faq-a');
                q.addEventListener('click', () => {
                    const isOpen = item.classList.contains('open');
                    document.querySelectorAll('.faq-item.open').forEach(o => {
                        o.classList.remove('open');
                        o.querySelector('.faq-a').style.maxHeight = null;
                    });
                    if (!isOpen) {
                        item.classList.add('open');
                        a.style.maxHeight = a.scrollHeight + 'px';
                    }
                });
            });
        }

        let selectedPaypalPlan = 'basic';
        function bindPricingButtons() {
            document.querySelectorAll('.plan-cta').forEach(btn => {
                btn.addEventListener('click', () => {
                    const plan = btn.dataset.plan;
                    selectedPaypalPlan = plan;
                    document.querySelectorAll('#paypalLinkRow .amount-chip').forEach(c => {
                        c.classList.toggle('active', c.dataset.plan === plan);
                    });
                    // يفتح رابط الدفع الحقيقي على PayPal لهذه الباقة في تبويب جديد فورًا
                    const link = PAYPAL_LINKS[plan];
                    if (link) window.open(link, '_blank', 'noopener,noreferrer');
                    document.getElementById('pay').scrollIntoView({ behavior: 'smooth' });
                });
            });
        }

        let yearly = false;
        function bindBillingAmounts(dict) {
            document.querySelectorAll('.plan-price .amount').forEach(el => {
                const val = yearly ? el.dataset.yearly : el.dataset.monthly;
                el.textContent = '$' + val;
            });
            document.querySelectorAll('.plan-price .period').forEach(el => {
                el.textContent = yearly ? dict.pricing.perMonthYearly : dict.pricing.perMonth;
            });
        }

        function applyStatic(dict) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const val = get(dict, key);
                if (val !== undefined) el.textContent = val;
            });
            document.querySelectorAll('[data-i18n-html]').forEach(el => {
                const key = el.getAttribute('data-i18n-html');
                const val = get(dict, key);
                if (val !== undefined) el.innerHTML = val;
            });
        }

        function setAuthMode(mode, dict) {
            const isSignup = mode === 'signup';
            document.getElementById('tabLogin').classList.toggle('active', !isSignup);
            document.getElementById('tabSignup').classList.toggle('active', isSignup);
            document.getElementById('nameField').style.display = isSignup ? 'block' : 'none';
            document.getElementById('authSubmit').textContent = isSignup ? dict.auth.submitSignup : dict.auth.submitLogin;
            const switchText = isSignup
                ? `${dict.auth.noAccount} <a href="#" id="modeLink">${dict.auth.loginLink}</a>`
                : `${dict.auth.haveAccount} <a href="#" id="modeLink">${dict.auth.signupLink}</a>`;
            document.getElementById('switchModeText').innerHTML = switchText;
            document.getElementById('modeLink').addEventListener('click', (e) => {
                e.preventDefault();
                setAuthMode(isSignup ? 'login' : 'signup', currentDict());
            });
        }

        let authMode = 'login';

        function currentDict() { return T[lang]; }

        function setLanguage(l) {
            lang = l;
            const dict = T[lang];
            const html = document.documentElement;
            html.lang = lang;
            html.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.title = lang === 'ar' ? 'منصّة | الذكاء الاصطناعي للشركات' : 'Platform | Enterprise AI';
            document.getElementById('langToggle').textContent = lang === 'ar' ? 'EN' : 'AR';
            applyStatic(dict);
            renderDynamic(dict);
            setAuthMode(authMode, dict);
            resetTyping(dict);
        }

        document.getElementById('langToggle').addEventListener('click', () => {
            setLanguage(lang === 'ar' ? 'en' : 'ar');
        });

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            const root = document.documentElement;
            const isLight = root.getAttribute('data-theme') === 'light';
            root.setAttribute('data-theme', isLight ? 'dark' : 'light');
            themeToggle.textContent = isLight ? '🌙' : '☀️';
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // Hero typing animation
        let typingTimer = null;
        let typingToken = 0;
        function resetTyping(dict) {
            typingToken++;
            const myToken = typingToken;
            const el = document.getElementById('typingMsg');
            const text = dict.hero.typing;
            let ci = 0;
            clearTimeout(typingTimer);
            function loop() {
                if (myToken !== typingToken) return;
                if (ci <= text.length) {
                    el.innerHTML = text.slice(0, ci) + '<span class="cursor"></span>';
                    ci++;
                    typingTimer = setTimeout(loop, 26);
                } else {
                    typingTimer = setTimeout(() => { ci = 0; loop(); }, 3500);
                }
            }
            loop();
        }

        // Billing switch
        document.getElementById('billingSwitch').addEventListener('click', () => {
            yearly = !yearly;
            document.getElementById('billingSwitch').classList.toggle('on', yearly);
            bindBillingAmounts(currentDict());
        });

        // --- حساب حقيقي: تخزين الجلسة محليًا + عدّاد تجربة حقيقي من السيرفر ---
        const SESSION_KEYS = ['nexus_api_key', 'nexus_company', 'nexus_plan', 'nexus_trial_ends_at', 'nexus_is_trial', 'nexus_paid_until', 'nexus_is_paid'];
        let trialCountdownTimer = null;

        function saveSession(data) {
            localStorage.setItem('nexus_api_key', data.api_key);
            localStorage.setItem('nexus_company', data.company || '');
            localStorage.setItem('nexus_plan', data.plan || '');
            localStorage.setItem('nexus_trial_ends_at', data.trial_ends_at || '');
            localStorage.setItem('nexus_is_trial', data.is_trial ? '1' : '0');
            localStorage.setItem('nexus_paid_until', data.paid_until || '');
            localStorage.setItem('nexus_is_paid', data.is_paid ? '1' : '0');
        }

        function clearSession() {
            SESSION_KEYS.forEach(k => localStorage.removeItem(k));
            clearInterval(trialCountdownTimer);
        }

        function startTrialCountdown(trialEndsAtIso) {
            clearInterval(trialCountdownTimer);
            const banner = document.getElementById('trialBanner');
            if (!trialEndsAtIso) { banner.style.display = 'none'; return; }
            banner.style.display = 'block';
            const endTime = new Date(trialEndsAtIso).getTime();
            const tick = () => {
                const diff = endTime - Date.now();
                if (diff <= 0) {
                    banner.textContent = lang === 'ar'
                        ? '⏳ انتهت فترتك التجريبية — يرجى الاشتراك بأحد الباقات للاستمرار.'
                        : '⏳ Your free trial has ended — please subscribe to continue.';
                    clearInterval(trialCountdownTimer);
                    return;
                }
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const sec = Math.floor((diff % 60000) / 1000);
                banner.textContent = lang === 'ar'
                    ? `⏳ باقي على نهاية التجربة: ${d} يوم ${h} س ${m} د ${sec} ث`
                    : `⏳ Trial ends in: ${d}d ${h}h ${m}m ${sec}s`;
            };
            tick();
            trialCountdownTimer = setInterval(tick, 1000);
        }

        function startPaidCountdown(paidUntilIso) {
            clearInterval(trialCountdownTimer);
            const banner = document.getElementById('trialBanner');
            if (!paidUntilIso) { banner.style.display = 'none'; return; }
            banner.style.display = 'block';
            const endTime = new Date(paidUntilIso).getTime();
            const tick = () => {
                const diff = endTime - Date.now();
                if (diff <= 0) {
                    banner.textContent = lang === 'ar'
                        ? '⏳ حان وقت تجديد الاشتراك — يرجى إعادة الدفع للاستمرار.'
                        : '⏳ Your subscription needs renewal — please pay again to continue.';
                    clearInterval(trialCountdownTimer);
                    return;
                }
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const sec = Math.floor((diff % 60000) / 1000);
                banner.textContent = lang === 'ar'
                    ? `✅ اشتراكك فعّال — يتجدد بعد: ${d} يوم ${h} س ${m} د ${sec} ث`
                    : `✅ Subscription active — renews in: ${d}d ${h}h ${m}m ${sec}s`;
            };
            tick();
            trialCountdownTimer = setInterval(tick, 1000);
        }

        function showLoggedInUI(data) {
            document.getElementById('authFormWrapper').style.display = 'none';
            document.getElementById('accountPanel').style.display = 'block';
            document.getElementById('accountName').textContent = data.company || '';
            document.getElementById('accountEmail').textContent = localStorage.getItem('nexus_email') || '';
            document.getElementById('accountApiKeyInput').value = data.api_key || localStorage.getItem('nexus_api_key') || '';
            if (data.is_trial) startTrialCountdown(data.trial_ends_at);
            else if (data.is_paid) startPaidCountdown(data.paid_until);
            else document.getElementById('trialBanner').style.display = 'none';

            document.getElementById('navLoginBtn').style.display = 'none';
            document.getElementById('navLogoutBtn').style.display = 'inline-flex';
        }

        function showLoggedOutUI() {
            document.getElementById('authFormWrapper').style.display = 'block';
            document.getElementById('accountPanel').style.display = 'none';
            document.getElementById('navLoginBtn').style.display = 'inline-flex';
            document.getElementById('navLogoutBtn').style.display = 'none';
            clearInterval(trialCountdownTimer);
        }

        async function handleAuthSuccess(data, email) {
            if (email) localStorage.setItem('nexus_email', email);
            saveSession(data);
            showLoggedInUI(data);
            // المفتاح يظهر هنا داخل بطاقة الحساب (accountApiKeyInput) فقط —
            // لا ننتقل لصندوق آخر بأسفل الصفحة.
            document.getElementById('accountPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
            showToast(lang === 'ar' ? `أهلًا بك، ${data.company}!` : `Welcome, ${data.company}!`);
        }

        async function restoreSession() {
            const apiKey = localStorage.getItem('nexus_api_key');
            if (!apiKey) { showLoggedOutUI(); return; }
            try {
                const res = await fetch(`${API_BASE_URL}/enterprise/me`, {
                    headers: { 'x-api-key': apiKey }
                });
                if (!res.ok) { clearSession(); showLoggedOutUI(); return; }
                const data = await res.json();
                const merged = {
                    company: data.company,
                    api_key: apiKey,
                    is_trial: data.is_trial,
                    trial_ends_at: data.trial_ends_at,
                    is_paid: data.is_paid,
                    paid_until: data.paid_until,
                };
                saveSession(merged);
                showLoggedInUI(merged);
            } catch (err) {
                // لا يمكن التحقق الآن (مثلاً لا اتصال) — نُبقي الجلسة كما هي محليًا
                showLoggedInUI({
                    company: localStorage.getItem('nexus_company'),
                    api_key: apiKey,
                    is_trial: localStorage.getItem('nexus_is_trial') === '1',
                    trial_ends_at: localStorage.getItem('nexus_trial_ends_at'),
                    is_paid: localStorage.getItem('nexus_is_paid') === '1',
                    paid_until: localStorage.getItem('nexus_paid_until'),
                });
            }
        }

        document.getElementById('accountLogoutBtn').addEventListener('click', async () => {
            clearSession();
            try { if (window.AuthAPI) await window.AuthAPI.logoutGoogle(); } catch (err) { /* لا مشكلة */ }
            showLoggedOutUI();
            showToast(lang === 'ar' ? 'تم تسجيل الخروج' : 'Logged out');
        });

        document.getElementById('navLogoutBtn').addEventListener('click', () => {
            document.getElementById('accountLogoutBtn').click();
        });

        // Auth tabs
        document.getElementById('tabLogin').addEventListener('click', () => { authMode = 'login'; setAuthMode('login', currentDict()); });
        document.getElementById('tabSignup').addEventListener('click', () => { authMode = 'signup'; setAuthMode('signup', currentDict()); });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dict = currentDict();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('authSubmit');
            const originalText = btn.textContent;
            btn.textContent = '...'; btn.disabled = true;

            try {
                if (authMode === 'login') {
                    const res = await fetch(`${API_BASE_URL}/enterprise/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password }),
                    });
                    const data = await res.json().catch(() => null);
                    if (!res.ok) {
                        showToast(data && data.detail ? data.detail : dict.auth.signupNetworkError);
                        return;
                    }
                    await handleAuthSuccess(data, email);
                } else {
                    const name = document.getElementById('companyName').value.trim();
                    if (!name) {
                        showToast(lang === 'ar' ? 'يرجى تعبئة اسم الشركة' : 'Please fill in the company name');
                        return;
                    }
                    const res = await fetch(`${API_BASE_URL}/enterprise/signup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name, email, password }),
                    });
                    const data = await res.json().catch(() => null);
                    if (!res.ok) {
                        showToast(data && data.detail ? data.detail : dict.auth.signupNetworkError);
                        return;
                    }
                    await handleAuthSuccess({ ...data, is_trial: true }, email);
                }
                document.getElementById('authForm').reset();
            } catch (err) {
                showToast(dict.auth.signupNetworkError);
            } finally {
                btn.textContent = originalText; btn.disabled = false;
            }
        });

        // تسجيل الدخول عبر Google: سيتوفر قريبًا (معطّل مؤقتًا بدل أن يفشل بصمت)
        document.getElementById('googleBtn').addEventListener('click', () => {
            showToast(lang === 'ar'
                ? 'تسجيل الدخول عبر Google سيتوفر قريبًا.'
                : 'Sign in with Google will be available soon.');
        });

        // Payment
        // --- Wire the PayPal per-plan buttons to the real payment links ---
        document.querySelectorAll('#paypalLinkRow .amount-chip').forEach(a => {
            a.href = PAYPAL_LINKS[a.dataset.plan];
            a.addEventListener('click', () => {
                document.querySelectorAll('#paypalLinkRow .amount-chip').forEach(c => c.classList.remove('active'));
                a.classList.add('active');
                selectedPaypalPlan = a.dataset.plan;
            });
        });

        // --- استعادة كلمة السر (حقيقية: رمز عشوائي من السيرفر، صالح 30 دقيقة) ---
        function openResetModal() {
            document.getElementById('resetModalOverlay').style.display = 'flex';
            document.getElementById('resetStepEmail').style.display = 'block';
            document.getElementById('resetStepToken').style.display = 'none';
            document.getElementById('resetEmailInput').value = document.getElementById('email').value || '';
        }
        function closeResetModal() {
            document.getElementById('resetModalOverlay').style.display = 'none';
        }

        document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
            e.preventDefault();
            openResetModal();
        });
        document.getElementById('resetModalClose').addEventListener('click', closeResetModal);
        document.getElementById('resetModalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'resetModalOverlay') closeResetModal();
        });

        document.getElementById('resetSendCodeBtn').addEventListener('click', async () => {
            const email = document.getElementById('resetEmailInput').value.trim();
            if (!email) { showToast(lang === 'ar' ? 'أدخل بريدك الإلكتروني' : 'Enter your email'); return; }
            const btn = document.getElementById('resetSendCodeBtn');
            const original = btn.textContent;
            btn.textContent = '...'; btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE_URL}/enterprise/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                const data = await res.json().catch(() => null);
                showToast(data && data.message ? data.message : (lang === 'ar' ? 'تم إرسال الطلب.' : 'Request sent.'));
                if (res.ok) {
                    document.getElementById('resetStepEmail').style.display = 'none';
                    document.getElementById('resetStepToken').style.display = 'block';
                }
            } catch (err) {
                showToast(lang === 'ar' ? 'تعذّر الاتصال بالخادم.' : 'Could not reach the server.');
            } finally {
                btn.textContent = original; btn.disabled = false;
            }
        });

        document.getElementById('resetConfirmBtn').addEventListener('click', async () => {
            const token = document.getElementById('resetTokenInput').value.trim();
            const new_password = document.getElementById('resetNewPasswordInput').value;
            if (!token || new_password.length < 6) {
                showToast(lang === 'ar' ? 'أدخل الرمز وكلمة سر لا تقل عن 6 أحرف' : 'Enter the code and a password of 6+ characters');
                return;
            }
            const btn = document.getElementById('resetConfirmBtn');
            const original = btn.textContent;
            btn.textContent = '...'; btn.disabled = true;
            try {
                const res = await fetch(`${API_BASE_URL}/enterprise/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password }),
                });
                const data = await res.json().catch(() => null);
                if (!res.ok) {
                    showToast(data && data.detail ? data.detail : (lang === 'ar' ? 'تعذّر تغيير كلمة السر.' : 'Could not reset password.'));
                    return;
                }
                showToast(data.message);
                closeResetModal();
                authMode = 'login';
                setAuthMode('login', currentDict());
                document.getElementById('resetTokenInput').value = '';
                document.getElementById('resetNewPasswordInput').value = '';
            } catch (err) {
                showToast(lang === 'ar' ? 'تعذّر الاتصال بالخادم.' : 'Could not reach the server.');
            } finally {
                btn.textContent = original; btn.disabled = false;
            }
        });

        // Init
        setLanguage('ar');
        restoreSession();
    </script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>
</body>
